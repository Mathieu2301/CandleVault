apiVersion: apps/v1
kind: Deployment
metadata:
  name: candlevault-agent
  namespace: candlevault
  labels:
    app: candlevault-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: candlevault-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: candlevault-agent
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: candlevault-agent
          image: ghcr.io/mathieu2301/candlevault-agent:latest
          imagePullPolicy: Always
          # No `command`/`args` override: the image entrypoint is
          # `dumb-init -- node main.js`, which forwards SIGTERM so the pod stops
          # promptly instead of waiting out the termination grace period.
          ports:
            - name: ws
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: candlevault-env
          # `/ping` is served by wsServer.js on the same port as the websocket.
          # Without probes a wedged event loop looked perfectly healthy to k8s.
          readinessProbe:
            httpGet:
              path: /ping
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: ws
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
