name: Publish to GHCR

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  # The crash loop that took the agent down was a plain unhandled rejection.
  # Tests now gate publishing so that class of bug cannot reach the cluster.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: server/yarn.lock
      - name: Install dependencies
        working-directory: server
        run: yarn install --frozen-lockfile
      - name: Lint
        working-directory: server
        run: yarn lint
      - name: Test
        working-directory: server
        run: yarn test

  publish-to-ghcr:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,arm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./server
          # `latest` is what the cluster tracks; the SHA tag makes rollbacks possible.
          tags: |
            ghcr.io/mathieu2301/candlevault-agent:latest
            ghcr.io/mathieu2301/candlevault-agent:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
